name: Customer installation checks
on:
  pull_request:
    paths: ['deploy/customer/**', 'scripts/*customer*', 'test/customer/**', '.github/workflows/customer-*.yml']
  push:
    branches: ['codex/v2.11.6-customer-install']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s test/customer -v
      - run: python3 -m py_compile deploy/customer/siftgate.py scripts/package-customer-release.py scripts/smoke-customer-install.py
      - run: node --check deploy/customer/container-ops.cjs
