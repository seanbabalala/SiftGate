name: Customer multi-platform release
# Ordinary branch pushes never publish an image or change a deployment.
# Manual runs test only. Pushing a reviewed version tag explicitly enables publication.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check Node runtime contract
        run: npm run runtime:check && npm run test:runtime
      - name: Check release boundary and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node scripts/check-public-release.js
          node scripts/check-docs.js
          node scripts/check-release-version.js
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
            test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
            git merge-base --is-ancestor HEAD origin/main
            # Customer smoke complements, but never substitutes for, the full main CI.
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$(git rev-parse HEAD)" -f status=success -f per_page=100 > /tmp/siftgate-main-ci.json
            python3 -c 'import json,sys; runs=json.load(open(sys.argv[1]))["workflow_runs"]; assert any(r["head_sha"] == sys.argv[2] and r["event"] == "push" and r["head_branch"] == "main" and r["conclusion"] == "success" for r in runs), "Wait for successful main push CI on this exact commit before publishing"' /tmp/siftgate-main-ci.json "$(git rev-parse HEAD)"
          fi
      - run: python3 -m unittest discover -s test/customer -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: siftgate-customer:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=customer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=customer-${{ matrix.arch }}
      - name: Real fresh-install, backup and restore acceptance
        run: python3 scripts/smoke-customer-install.py --image siftgate-customer:smoke
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture candidate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag siftgate-customer:smoke "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          mkdir -p output/customer-image
          python3 -c 'import json,re,sys; arch,commit,digest=sys.argv[1:]; assert arch in ("amd64","arm64") and re.fullmatch("sha256:[a-f0-9]{64}",digest); json.dump({"architecture":arch,"commit":commit,"digest":digest},open("output/customer-image/"+arch+".json","w"))' "$ARCH" "$SOURCE_SHA" "$digest"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          name: customer-image-${{ matrix.arch }}
          path: output/customer-image/*.json
          if-no-files-found: error
          retention-days: 90
  publish:
    timeout-minutes: 20
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: customer-image-*
          path: output/customer-image
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version and installer (never latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="${repository}:${GITHUB_REF_NAME}"
          # Read immutable digests produced by THIS run, never a mutable staging tag.
          candidate_digest() {
            python3 -c 'import json,re,sys; m=json.load(open(sys.argv[1])); assert m["commit"] == sys.argv[2] and m["architecture"] == sys.argv[3] and re.fullmatch("sha256:[a-f0-9]{64}",m["digest"]); print(m["digest"])' \
              "output/customer-image/$1.json" "$(git rev-parse HEAD)" "$1"
          }
          amd="$(candidate_digest amd64)"
          arm="$(candidate_digest arm64)"
          # Publish both vX.Y.Z and X.Y.Z; existing Helm/Kustomize defaults use X.Y.Z.
          for alias in "$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}"; do
            ref="${repository}:${alias}"
            if docker buildx imagetools inspect "$ref" --raw > /tmp/siftgate-existing-manifest.json 2>/tmp/siftgate-manifest-error; then
              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert sorted(x["digest"] for x in m["manifests"]) == sorted(sys.argv[2:]), "Existing release differs; refusing overwrite"' \
                /tmp/siftgate-existing-manifest.json "$amd" "$arm"
            else
              # A network/auth error is not evidence that an immutable tag is absent.
              if ! grep -Fq -- "$ref: not found" /tmp/siftgate-manifest-error && \
                 ! grep -Fq -- 'manifest unknown' /tmp/siftgate-manifest-error; then
                echo 'Unable to establish whether the version exists; refusing a possibly destructive push.' >&2
                exit 1
              fi
              docker buildx imagetools create -t "$ref" "${repository}@${amd}" "${repository}@${arm}"
            fi
          done
          # GHCR packages can initially be private. Do not ship an unusable public installer.
          # Owner: set package visibility, then rerun failed jobs (not the successful builds).
          DOCKER_CONFIG="$(mktemp -d)" docker manifest inspect "$image" >/dev/null
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          bare_digest="$(docker buildx imagetools inspect "${repository}:${GITHUB_REF_NAME#v}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$digest" = "$bare_digest"
          docker buildx imagetools inspect "$image" --raw > /tmp/siftgate-release-index.json
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1]))["manifests"]; actual={(x["platform"]["os"],x["platform"]["architecture"]):x["digest"] for x in m}; assert len(m)==2 and actual=={("linux","amd64"):sys.argv[2],("linux","arm64"):sys.argv[3]}, "Index platform/digest mapping differs from tested images"' /tmp/siftgate-release-index.json "$amd" "$arm"
          python3 scripts/package-customer-release.py --version "$GITHUB_REF_NAME" \
            --image "${repository}@${digest}" --output output/customer-release
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft "${flags[@]}"
          fi
          python3 scripts/upload-customer-assets.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --directory output/customer-release
          python3 scripts/upload-customer-assets.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --directory output/customer-release --verify-only
          gh release edit "$GITHUB_REF_NAME" --draft=false
          {
            echo '## Customer release'
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Image: ${repository}@${digest}"
            echo "Aliases: ${GITHUB_REF_NAME}, ${GITHUB_REF_NAME#v}"
            echo "Platforms: linux/amd64 (${amd}), linux/arm64 (${arm})"
            echo 'Anonymous manifest access and downloaded release asset bytes verified.'
            cat output/customer-release/*.sha256
          } >> "$GITHUB_STEP_SUMMARY"
